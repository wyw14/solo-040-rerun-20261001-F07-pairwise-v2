<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Gate Deviations</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a href="/chamber">Chamber</a><a href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a><a aria-current="page" href="/deviations">Deviations</a></nav></header>
<main><div class="page-title"><div><h1>Gate command deviations</h1><div class="muted">Commands whose target position is not confirmed by a field observation</div></div><button id="refresh">Refresh</button></div><div id="chambers"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,shortID,setMessage,withBusy}=window.LockFlow;
const host=document.querySelector('#chambers'); const message=document.querySelector('#message');
const fmtDuration=(seconds)=>{if(seconds===null||seconds===undefined)return '-';const s=Math.round(seconds);if(s<60)return `${s}s`;const m=Math.floor(s/60);return `${m}m ${s%60}s`;};
const statusClass=(status)=>status==='active'?'critical':(status==='acknowledged'?'warning':'');
async function acknowledge(id,button){await withBusy(button,async()=>{try{await api(`/api/deviations/${id}/acknowledge`,{method:'POST',body:JSON.stringify({note:'operator handling'})});await load();}catch(e){setMessage(message,e.message);}});}
function row(item){const open=item.status!=='resolved';const action=open?`<button data-ack="${item.id}">Acknowledge</button>`:'<span class="muted">auto</span>';return `<tr><td>${item.device} (${item.direction})</td><td>${item.command_action} &rarr; ${item.target_position}</td><td>${item.actual_position}</td><td>${fmtDuration(item.duration_seconds)}</td><td>${new Date(item.detected_at).toLocaleString()}</td><td><span class="status ${statusClass(item.status)}">${item.status}</span></td><td>${action}</td></tr>`;}
async function load(){
  const items=await api('/api/deviations');
  const byChamber={};
  for(const item of items){(byChamber[item.chamber_id]??=[]).push(item);}
  const chambers=Object.keys(byChamber).sort();
  host.innerHTML=chambers.map((id)=>{const list=byChamber[id];const openCount=list.filter((i)=>i.status!=='resolved').length;
    return `<section class="panel wide" style="margin-bottom:14px"><h2>${id} ${openCount?`<span class="status critical">${openCount} open</span>`:''}</h2><table><thead><tr><th>Device</th><th>Command &rarr; target</th><th>Actual position</th><th>Duration</th><th>Detected</th><th>Status</th><th>Handling</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></section>`;
  }).join('')||'<section class="panel wide"><span class="muted">No gate command deviations</span></section>';
  host.querySelectorAll('[data-ack]').forEach((button)=>button.addEventListener('click',()=>acknowledge(button.dataset.ack,button)));
  setMessage(message,'');
}
document.querySelector('#refresh').addEventListener('click',()=>load().catch((e)=>setMessage(message,e.message)));
load().catch((e)=>setMessage(message,e.message));
setInterval(()=>load().catch(()=>{}),5000);
</script></body></html>
